<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Alert - SMARTA Device</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0b1020;
            color: #fff;
            overflow: hidden;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            background: linear-gradient(180deg, rgba(8,13,29,0.92), rgba(8,13,29,0.68));
            padding: 13px 24px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.12);
            pointer-events: none;
        }
        h1 {
            font-size: 1.7rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        #hint { color: #94a3b8; font-size: 0.85rem; }
        #tooltip {
            position: fixed;
            z-index: 200;
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(102,126,234,0.5);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            pointer-events: none;
            display: none;
            max-width: 260px;
        }
        #tooltip .name { font-weight: 700; color: #818cf8; margin-bottom: 4px; }
        #tooltip .desc { color: #cbd5e1; font-size: 0.8rem; line-height: 1.4; }
        #status {
            position: fixed;
            bottom: 86px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #10b981;
            pointer-events: none;
            transition: all 0.3s;
        }
        #loading {
            position: fixed; inset: 0; z-index: 300;
            background: #12162a; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 15px;
            transition: opacity 0.5s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(102,126,234,0.2);
            border-top-color: #667eea; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ===== SCENE UI (Phase 2) ===== */
        #scene-info {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.72);
            padding: 14px 20px;
            border-radius: 14px;
            border: 1px solid rgba(102,126,234,0.35);
            backdrop-filter: blur(8px);
            max-width: 300px;
            bottom: 82px;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #scene-info .scene-num { font-size: 0.7rem; letter-spacing: 0.12em; color: #818cf8; text-transform: uppercase; margin-bottom: 4px; }
        #scene-info .scene-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        #scene-info .scene-desc { font-size: 0.8rem; color: #cbd5e1; line-height: 1.45; }

        #progress-dots {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 8px;
            background: rgba(0,0,0,0.55);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }
        #progress-dots .dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s;
            cursor: pointer;
            pointer-events: auto;
        }
        #progress-dots .dot.active {
            background: #667eea;
            transform: scale(1.4);
            box-shadow: 0 0 10px rgba(102,126,234,0.8);
        }
        #progress-dots .dot.done { background: #764ba2; }

        #controls {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        #controls button {
            width: 42px; height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(102,126,234,0.4);
            background: rgba(15,23,42,0.8);
            color: #e2e8f0;
            font-size: 1.05rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        #controls button:hover { background: rgba(102,126,234,0.3); transform: translateY(-2px); }
        #controls button:active { transform: translateY(0); }

        #stats-overlay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 150;
            background: rgba(15,23,42,0.92);
            border: 1px solid rgba(102,126,234,0.5);
            border-radius: 18px;
            padding: 24px 32px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s;
            backdrop-filter: blur(10px);
        }
        #stats-overlay.show { opacity: 1; }
        #stats-overlay h3 { font-size: 1.3rem; margin-bottom: 12px; background: linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        #stats-overlay .stat { display: flex; justify-content: space-between; gap: 30px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 0.9rem; }
        #stats-overlay .stat .v { color: #10b981; font-weight: 700; }
        #stats-overlay .check { font-size: 2.6rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div id="loading"><div class="spinner"></div><div style="color:#9ca3af">Memuat kamar tidur...</div></div>
    <div id="info">
        <h1>💤 SLEEP ALERT - SMARTA</h1>
        <div id="hint">🖱️ Drag untuk putar kamera · Scroll untuk zoom · Klik benda untuk interaksi</div>
    </div>
    <div id="tooltip"></div>
    <div id="status">Kamar siap — klik benda untuk interaksi</div>

    <!-- Phase 2: Scene Storyline UI -->
    <div id="scene-info">
        <div class="scene-num" id="scene-num">Scene 1/8</div>
        <div class="scene-title" id="scene-title">Meet SMARTA</div>
        <div class="scene-desc" id="scene-desc"></div>
    </div>
    <div id="progress-dots"></div>
    <div id="controls">
        <button id="btn-skip-back" title="Scene sebelumnya">⏮</button>
        <button id="btn-play" title="Play/Pause">⏸</button>
        <button id="btn-skip-next" title="Scene berikutnya">⏭</button>
        <button id="btn-reset" title="Reset kamera">⟳</button>
    </div>
    <div id="stats-overlay">
        <div class="check">✅</div>
        <h3>Sleep Analysis Complete</h3>
        <div class="stat"><span>Kualitas Tidur</span><span class="v">92%</span></div>
        <div class="stat"><span>Durasi</span><span class="v">7j 42m</span></div>
        <div class="stat"><span>Gerakan Terdeteksi</span><span class="v">14×</span></div>
        <div class="stat"><span>Snoring</span><span class="v">Rendah</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // ===== GLOBAL STATE =====
        var scene, camera, renderer, controls, raycaster, pointer;
        var smartaDevice, bed, person, nightstand, cloudNode;
        var particles = [], interactables = [];
        var clock = new THREE.Clock();
        var tooltip = document.getElementById('tooltip');
        var statusEl = document.getElementById('status');
        var ceilingLight;

        var statusTimer;
        // ===== STORYLINE STATE (Phase 2) =====
        var currentScene = 0;
        var isPlaying = true;
        var sceneTimer = null;
        var effectTimer = null; // timeout executeSceneAction yang tertunda (harus dibatalkan saat lompat scene)
        var camAnim = null; // { startPos, startTarget, endPos, endTarget, arc, t0, dur }
        var dotEls = [];
        var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var storyRuntime = { startedAt: 0, actionStarted: false };
        var smartaBaseY = 1.56;

        var storyScenes = [
            { id:1, title:'Meet SMARTA', desc:'ESP32, PIR, dan mic bekerja dalam satu perangkat kecil.', cam:{p:[-4.1,2.05,3.05], t:[-2.8,1.54,1.6]}, dur:5600, settle:1500, act:'meet' },
            { id:2, title:'Bedroom Setup', desc:'SMARTA ditempatkan di nakas, menghadap area tidur.', cam:{p:[3.8,3.45,7.8], t:[0,1.18,0]}, dur:5200, settle:1250, act:'wide' },
            { id:3, title:'User Falls Asleep', desc:'Napas melambat. Monitoring dimulai saat kamar tenang.', cam:{p:[2.65,1.92,3.25], t:[0.05,1.33,-0.35]}, dur:5800, settle:1350, act:'person' },
            { id:4, title:'PIR Motion Detection', desc:'PIR mengunci gerakan kecil pada dada dan bahu.', cam:{p:[-1.1,1.72,2.65], t:[-0.55,1.34,0.08]}, dur:6200, settle:1450, act:'pir' },
            { id:5, title:'Sound Monitoring', desc:'Gelombang suara bergerak dari kepala menuju mic.', cam:{p:[-3.65,1.85,3.05], t:[-1.2,1.42,0.72]}, dur:6200, settle:1450, act:'mic' },
            { id:6, title:'ESP32 Processing', desc:'Data diringkas secara lokal sebelum dikirim.', cam:{p:[-2.55,1.78,2.35], t:[-2.7,1.55,1.6]}, dur:5800, settle:1350, act:'esp32' },
            { id:7, title:'Cloud Transmission', desc:'Paket data naik melalui WiFi menuju server aman.', cam:{p:[0.65,3.75,6.7], t:[-0.25,1.82,0.7]}, dur:6200, settle:1600, act:'cloud' },
            { id:8, title:'Sleep Analysis Complete', desc:'Ringkasan tidur tampil setelah semua data selesai diproses.', cam:{p:[0.75,3.15,7.55], t:[0,1.32,0]}, dur:7200, settle:1700, act:'stats' }
        ];

        function showStatus(msg, color) {
            statusEl.textContent = msg;
            statusEl.style.color = color || '#10b981';
            clearTimeout(statusTimer);
            statusTimer = setTimeout(function() {
                statusEl.style.color = '#10b981';
                statusEl.textContent = 'Kamar siap — klik benda untuk interaksi';
            }, 2600);
        }

        function addInteractable(obj, name, desc, onClick) {
            // MERGE userData, jangan timpa — referensi sensor (pirLens, mic, beam, torso) harus dipertahankan
            var ud = obj.userData || {};
            ud.name = name;
            ud.desc = desc;
            ud.onClick = onClick;
            ud.isInteractable = true;
            obj.userData = ud;
            interactables.push(obj);
            return obj;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1020);
            scene.fog = new THREE.Fog(0x0b1020, 18, 42);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(4, 4.5, 9);
            camera.lookAt(0, 1.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.86;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // OrbitControls (kamera) — drag rotate, scroll zoom
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 2.5;
            controls.maxDistance = 18;
            controls.maxPolarAngle = Math.PI * 0.55;
            controls.target.set(0, 1.5, 0);
            controls.update();

            raycaster = new THREE.Raycaster();
            pointer = new THREE.Vector2();

            // Lighting
            var ambient = new THREE.AmbientLight(0x7180ad, 0.56);
            scene.add(ambient);

            ceilingLight = new THREE.PointLight(0xffe6b8, 0.82, 16, 2);
            ceilingLight.position.set(0, 5.5, 0);
            ceilingLight.castShadow = true;
            ceilingLight.shadow.mapSize.set(1024, 1024);
            scene.add(ceilingLight);

            var moonlight = new THREE.DirectionalLight(0x6b8cff, 0.48);
            moonlight.position.set(-6, 6, -6);
            moonlight.castShadow = true;
            moonlight.shadow.mapSize.set(2048, 2048);
            moonlight.shadow.camera.left = -8;
            moonlight.shadow.camera.right = 8;
            moonlight.shadow.camera.top = 8;
            moonlight.shadow.camera.bottom = -8;
            scene.add(moonlight);

            createRoom();
            createBed();
            createPerson();
            createNightstand();
            createSmarta();
            createParticles();

            startStory();

            window.addEventListener('resize', onResize);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('click', onPointerClick);

            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
            }, 600);

            animate();
        }

        // ===== MATERIALS =====
        function matWood() { return new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 }); }
        function matWoodDark() { return new THREE.MeshStandardMaterial({ color: 0x5d3a1a, roughness: 0.55 }); }
        function matMetal() { return new THREE.MeshStandardMaterial({ color: 0x3a3f4a, metalness: 0.7, roughness: 0.4 }); }
        function matFabric(c) { return new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 }); }

        function createRoom() {
            var room = new THREE.Group();

            // Lantai kayu
            var floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14, 28, 28), matWood());
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            room.add(floor);

            // Karpet bulat
            var rug = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.03, 32), matFabric(0x5b4a6a));
            rug.position.set(0, 0.015, 0);
            rug.receiveShadow = true;
            room.add(rug);

            var wallMat = new THREE.MeshStandardMaterial({ color: 0x2b3650, roughness: 0.85 });
            // Dinding belakang
            var backWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), wallMat);
            backWall.position.set(0, 3, -7);
            backWall.receiveShadow = true;
            room.add(backWall);
            // Dinding kiri
            var leftWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), wallMat);
            leftWall.rotation.y = Math.PI / 2;
            leftWall.position.set(-7, 3, 0);
            leftWall.receiveShadow = true;
            room.add(leftWall);
            // Dinding kanan
            var rightWall = new THREE.Mesh(new THREE.PlaneGeometry(14, 6), new THREE.MeshStandardMaterial({ color: 0x242e48, roughness: 0.85 }));
            rightWall.rotation.y = -Math.PI / 2;
            rightWall.position.set(7, 3, 0);
            rightWall.receiveShadow = true;
            room.add(rightWall);

            // Langit-langit
            var ceiling = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({ color: 0x3a4560, roughness: 0.9 }));
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 6;
            room.add(ceiling);

            // Lampu gantung (interaktif)
            var lampFixture = new THREE.Group();
            var cord = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 8), matMetal());
            cord.position.y = -0.4;
            lampFixture.add(cord);
            var shade = new THREE.Mesh(
                new THREE.ConeGeometry(0.7, 0.55, 24, 1, true),
                new THREE.MeshStandardMaterial({ color: 0xfff4d6, emissive: 0xffe0a0, emissiveIntensity: 0.6, side: THREE.DoubleSide })
            );
            shade.position.y = -0.7;
            lampFixture.add(shade);
            var bulb = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff0c0, emissiveIntensity: 1.2 })
            );
            bulb.position.y = -0.62;
            lampFixture.add(bulb);
            lampFixture.position.set(0, 5.6, 0);
            room.add(lampFixture);
            addInteractable(lampFixture, 'Lampu Langit-langit', 'Klik untuk mati/nyalakan.', function() {
                var on = ceilingLight.visible;
                ceilingLight.visible = !on;
                bulb.material.emissiveIntensity = on ? 0 : 1.2;
                shade.material.emissiveIntensity = on ? 0 : 0.6;
                showStatus(on ? '💡 Lampu langit-langit MATI' : '💡 Lampu langit-langit MENYALA', '#fbbf24');
            });

            // Jendela
            var winGroup = new THREE.Group();
            winGroup.add(new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.6, 0.12), matWoodDark()));
            var windowGlass = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.4, 0.04), new THREE.MeshStandardMaterial({ color: 0x1a2b4a, roughness: 0.1, metalness: 0.3, emissive: 0x3a5ab0, emissiveIntensity: 0.5 }));
            windowGlass.position.set(0, 0, 0.05);
            winGroup.add(windowGlass);
            winGroup.position.set(-3.5, 2.6, -6.9);
            room.add(winGroup);

            scene.add(room);
        }

        function createBed() {
            bed = new THREE.Group();
            var frameMat = matWoodDark();

            var headboard = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.6, 0.25), frameMat);
            headboard.position.set(0, 1.0, -2.15);
            headboard.castShadow = true;
            bed.add(headboard);

            var footboard = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.7, 0.2), frameMat);
            footboard.position.set(0, 0.5, 2.15);
            footboard.castShadow = true;
            bed.add(footboard);

            var railL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 4.4), frameMat);
            railL.position.set(-1.7, 0.4, 0);
            railL.castShadow = true;
            bed.add(railL);
            var railR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.35, 4.4), frameMat);
            railR.position.set(1.7, 0.4, 0);
            railR.castShadow = true;
            bed.add(railR);

            var slats = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 4.2), matWood());
            slats.position.y = 0.45;
            bed.add(slats);

            var mattress = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.55, 4.2), matFabric(0xe8e8f0));
            mattress.position.y = 0.8;
            mattress.castShadow = true;
            bed.add(mattress);

            var pillowMat = matFabric(0xf5f5fa);
            var pillow1 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.28, 0.85), pillowMat);
            pillow1.position.set(-0.55, 1.22, -1.5);
            pillow1.rotation.x = -0.06;
            pillow1.castShadow = true;
            bed.add(pillow1);
            var pillow2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.28, 0.85), pillowMat);
            pillow2.position.set(0.55, 1.22, -1.5);
            pillow2.rotation.x = -0.06;
            pillow2.castShadow = true;
            bed.add(pillow2);

            var blanket = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.25, 2.6), matFabric(0x667eea));
            blanket.position.set(0, 1.2, 0.75);
            blanket.castShadow = true;
            bed.add(blanket);
            var fold = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.16, 0.7), matFabric(0x7788ee));
            fold.position.set(0, 1.3, 1.62);
            fold.rotation.x = -0.15;
            fold.castShadow = true;
            bed.add(fold);
            bed.userData.blanket = blanket;
            bed.userData.fold = fold;

            scene.add(bed);
            addInteractable(bed, 'Kasur', 'Kasur kayu dengan selimut biru. User tidur di atasnya.', function() {
                showStatus('🛏️ Kasur — tempat user tidur dan dimonitor SMARTA', '#818cf8');
            });
        }

        function createPerson() {
            person = new THREE.Group();
            var skin = new THREE.MeshStandardMaterial({ color: 0xf0c8a0, roughness: 0.8 });
            var shirt = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, roughness: 0.85 });

            // Berbaring di kasur: kepala di bantal (z≈-1.5), badan memanjang ke arah kaki (+Z)
            var torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.85, 8, 16), shirt);
            torso.rotation.x = Math.PI / 2;               // rebahkan sepanjang sumbu Z
            torso.position.set(0.45, 0.98, -0.75);        // dada ~1.28 (benam di kasur, bukan melayang)
            torso.castShadow = true;
            person.add(torso);
            person.userData.torso = torso;

            var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.2, 12), skin);
            neck.rotation.x = Math.PI / 2;
            neck.position.set(0.55, 1.14, -1.05);
            neck.castShadow = true;
            person.add(neck);
            person.userData.neck = neck;

            var head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 20), skin);
            head.position.set(0.55, 1.16, -1.3);          // bersandar di bantal (top bantal y≈1.36)
            head.castShadow = true;
            person.add(head);
            person.userData.head = head;
            person.userData.headBaseY = 1.16;

            var hair = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 20, 0, Math.PI * 2, 0, Math.PI * 0.55), new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.7 }));
            hair.rotation.z = 0.3;
            hair.rotation.y = -0.4;
            hair.position.set(0.55, 1.2, -1.32);
            person.add(hair);

            // Lengan di atas selimut, di samping badan
            var armGeo = new THREE.CapsuleGeometry(0.09, 0.5, 4, 8);
            var armL = new THREE.Mesh(armGeo, skin);
            armL.rotation.x = Math.PI / 2;
            armL.position.set(0.12, 1.38, -0.15);
            armL.castShadow = true;
            person.add(armL);
            var armR = new THREE.Mesh(armGeo, skin);
            armR.rotation.x = Math.PI / 2;
            armR.position.set(0.8, 1.38, -0.15);
            armR.castShadow = true;
            person.add(armR);
            var handL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), skin);
            handL.position.set(0.12, 1.38, 0.15);
            person.add(handL);
            var handR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 10), skin);
            handR.position.set(0.8, 1.38, 0.15);
            person.add(handR);

            scene.add(person);

                );

        function onPointerMove(e) {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            var intersects = raycaster.intersectObjects(interactables, true);
            if (intersects.length > 0) {
                var obj = intersects[0].object;
                var root = obj.userData.isInteractable ? obj : findRoot(obj);
                if (root) {
                    document.body.style.cursor = 'pointer';
                    tooltip.style.display = 'block';
                    tooltip.style.left = (e.clientX + 14) + 'px';
                    tooltip.style.top = (e.clientY - 10) + 'px';
                    tooltip.innerHTML = '<div class="name">' + root.userData.name + '</div><div class="desc">' + root.userData.desc + '</div>';
                    return;
                }
            }
            document.body.style.cursor = 'default';
            tooltip.style.display = 'none';
        }

        function onPointerClick(e) {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            var intersects = raycaster.intersectObjects(interactables, true);
            if (intersects.length > 0) {
                var obj = intersects[0].object;
                var root = obj.userData.isInteractable ? obj : findRoot(obj);
                if (root && root.userData.onClick) root.userData.onClick();
            }
        }

        function findRoot(obj) {
            var cur = obj;
            while (cur) {
                if (cur.userData && cur.userData.isInteractable) return cur;
                cur = cur.parent;
            }
            return null;
        }

        // ===== STORYLINE SYSTEM (Phase 2) =====
        function buildProgressDots() {
            var wrap = document.getElementById('progress-dots');
            wrap.innerHTML = '';
            dotEls = [];
            for (var i = 0; i < storyScenes.length; i++) {
                (function(idx) {
                    var d = document.createElement('span');
                    d.className = 'dot';
                    d.title = storyScenes[idx].title;
                    d.addEventListener('click', function(ev) {
                        ev.stopPropagation();
                        if (!isPlaying) transitionToScene(idx);
                        else jumpToScene(idx);
                    });
                    wrap.appendChild(d);
                    dotEls.push(d);
                })(i);
            }
        }

        function updateSceneUI(scene) {
            document.getElementById('scene-num').textContent = 'Scene ' + scene.id + '/' + storyScenes.length;
            document.getElementById('scene-title').textContent = scene.title;
            document.getElementById('scene-desc').textContent = scene.desc;
            // Fade halus setiap ganti scene
            var si = document.getElementById('scene-info');
            si.style.opacity = '0';
            setTimeout(function() { si.style.opacity = '1'; }, 60);
            dotEls.forEach(function(d, i) {
                d.className = 'dot';
                if (i === scene.id - 1) d.classList.add('active');
                else if (i < scene.id - 1) d.classList.add('done');
            });
        }

        // Kamera bergerak pada arc kecil agar perpindahan terasa seperti dolly, bukan teleport.
        function animateCameraTo(pos, target, dur, arcHeight) {
            var endPos = new THREE.Vector3(pos[0], pos[1], pos[2]);
            var distance = camera.position.distanceTo(endPos);
            camAnim = {
                startPos: camera.position.clone(),
                startTarget: controls.target.clone(),
                endPos: endPos,
                endTarget: new THREE.Vector3(target[0], target[1], target[2]),
                arc: arcHeight === undefined ? Math.min(0.7, 0.16 + distance * 0.045) : arcHeight,
                t0: clock.getElapsedTime(),
                dur: prefersReducedMotion ? 1 : (dur || 2000)
            };
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function easeOutQuint(t) {
            return 1 - Math.pow(1 - t, 5);
        }

        function executeSceneAction(act) {
            if (!smartaDevice) return;
            var pl = smartaDevice.userData.pirLens;
            var mc = smartaDevice.userData.mic;
            var beam = smartaDevice.userData.beam;
            var waves = smartaDevice.userData.soundWaves;
            var screen = smartaDevice.userData.screen;
            var leds = smartaDevice.userData.leds || [];

            storyRuntime.actionStarted = true;
            if (beam) beam.visible = false;
            if (waves) waves.forEach(function(w) { w.visible = false; });
            particles.forEach(function(p) { p.visible = false; p.userData.progress = Math.random() * 0.22; });
            if (pl) pl.material.emissiveIntensity = 0.38;
            if (mc) mc.material.emissiveIntensity = 0.38;
            if (screen) screen.material.emissiveIntensity = 0.42;
            leds.forEach(function(led, i) { led.material.opacity = i === 0 ? 0.42 : 0.18; });

            switch (act) {
                case 'meet':
                    if (screen) screen.material.emissiveIntensity = 1.0;
                    leds.forEach(function(led) { led.material.opacity = 0.85; });
                    showStatus('SMARTA aktif — mengenali tiga jalur sensor', '#a5b4fc');
                    break;
                case 'wide':
                    showStatus('Kamar tenang — SMARTA siap memantau', '#cbd5e1');
                    break;
                case 'person':
                    showStatus('User tertidur — monitoring dimulai', '#c4b5fd');
                    break;
                case 'pir':
                    if (beam) beam.visible = true;
                    particles.forEach(function(p) { if (p.userData.type === 'PIR') p.visible = true; });
                    if (pl) pl.material.emissiveIntensity = 1.45;
                    showStatus('PIR mengunci gerakan kecil pada dada', '#a5b4fc');
                    break;
                case 'mic':
                    if (waves) waves.forEach(function(w) { w.visible = true; });
                    particles.forEach(function(p) { if (p.userData.type === 'MIC') p.visible = true; });
                    if (mc) mc.material.emissiveIntensity = 1.45;
                    showStatus('Mic menangkap pola suara dari sekitar kepala', '#f9a8d4');
                    break;
                case 'esp32':
                    if (pl) pl.material.emissiveIntensity = 0.82;
                    if (mc) mc.material.emissiveIntensity = 0.82;
                    if (screen) screen.material.emissiveIntensity = 1.15;
                    showStatus('ESP32 merangkum data secara lokal', '#86efac');
                    break;
                case 'cloud':
                    particles.forEach(function(p) { p.visible = true; p.userData.cloud = true; });
                    if (cloudNode) cloudNode.visible = true;
                    if (screen) screen.material.emissiveIntensity = 1.05;
                    showStatus('Paket data naik melalui WiFi ke server aman', '#7dd3fc');
                    break;
                case 'stats':
                    var ov = document.getElementById('stats-overlay');
                    ov.classList.add('show');
                    showStatus('Analisis tidur selesai', '#86efac');
                    break;
                default:
                    showStatus('SMARTA — intelligent sleep monitoring', '#a5b4fc');
            }
        }

        function clearSceneEffects() {
            var ov = document.getElementById('stats-overlay');
            ov.classList.remove('show');
            var beam = smartaDevice && smartaDevice.userData.beam;
            var waves = smartaDevice && smartaDevice.userData.soundWaves;
            if (cloudNode) cloudNode.visible = false;
            // Default: semua efek MATI, baru dinyalakan sesuai aksi scene
            if (beam) beam.visible = false;
            if (waves) waves.forEach(function(w) { w.visible = false; });
            particles.forEach(function(p) { p.visible = false; });
            if (smartaDevice) {
                var pl = smartaDevice.userData.pirLens;
                var mc = smartaDevice.userData.mic;
                var screen = smartaDevice.userData.screen;
                var leds = smartaDevice.userData.leds || [];
                if (pl) pl.material.emissiveIntensity = 0.38;
                if (mc) mc.material.emissiveIntensity = 0.38;
                if (screen) screen.material.emissiveIntensity = 0.42;
                leds.forEach(function(led, i) { led.material.opacity = i === 0 ? 0.42 : 0.18; });
                particles.forEach(function(p) { p.userData.cloud = false; });
            }
        }

        function transitionToScene(index) {
            index = Math.max(0, Math.min(index, storyScenes.length - 1));
            currentScene = index;
            var scene = storyScenes[currentScene];
            storyRuntime.startedAt = clock.getElapsedTime();
            storyRuntime.actionStarted = false;
            clearSceneEffects();
            updateSceneUI(scene);
            animateCameraTo(scene.cam.p, scene.cam.t, Math.max(1200, scene.settle + 500));
            clearTimeout(effectTimer);
            effectTimer = setTimeout(function() { executeSceneAction(scene.act); }, scene.settle);

            clearTimeout(sceneTimer);
            if (isPlaying) {
                sceneTimer = setTimeout(function() {
                    if (currentScene < storyScenes.length - 1) transitionToScene(currentScene + 1);
                    else setPlaying(false);
                }, scene.dur + scene.settle);
            }
        }

        function jumpToScene(index) {
            index = Math.max(0, Math.min(index, storyScenes.length - 1));
            currentScene = index;
            var scene = storyScenes[currentScene];
            storyRuntime.startedAt = clock.getElapsedTime();
            storyRuntime.actionStarted = true;
            clearSceneEffects();
            updateSceneUI(scene);
            camera.position.set(scene.cam.p[0], scene.cam.p[1], scene.cam.p[2]);
            controls.target.set(scene.cam.t[0], scene.cam.t[1], scene.cam.t[2]);
            controls.update();
            clearTimeout(effectTimer);
            executeSceneAction(scene.act);

            clearTimeout(sceneTimer);
            if (isPlaying) {
                sceneTimer = setTimeout(function() {
                    if (currentScene < storyScenes.length - 1) transitionToScene(currentScene + 1);
                    else setPlaying(false);
                }, scene.dur);
            }
        }

        function setPlaying(play) {
            isPlaying = play;
            document.getElementById('btn-play').textContent = play ? '⏸' : '▶';
            if (play && currentScene === storyScenes.length - 1) {
                // Replay dari awal
                transitionToScene(0);
                return;
            }
            if (play) {
                sceneTimer = setTimeout(function() {
                    if (currentScene < storyScenes.length - 1) transitionToScene(currentScene + 1);
                    else setPlaying(false);
                }, storyScenes[currentScene].dur);
            } else {
                clearTimeout(sceneTimer);
                clearTimeout(effectTimer);
            }
        }

        function startStory() {
            buildProgressDots();
            document.getElementById('btn-play').addEventListener('click', function() { setPlaying(!isPlaying); });
            document.getElementById('btn-skip-next').addEventListener('click', function() {
                if (currentScene < storyScenes.length - 1) { if (isPlaying) transitionToScene(currentScene + 1); else jumpToScene(currentScene + 1); }
            });
            document.getElementById('btn-skip-back').addEventListener('click', function() {
                if (currentScene > 0) { if (isPlaying) transitionToScene(currentScene - 1); else jumpToScene(currentScene - 1); }
            });
            document.getElementById('btn-reset').addEventListener('click', function() {
                animateCameraTo([4, 4.5, 9], [0, 1.5, 0], 1700, 0.25);
                showStatus('⟳ Kamera direset', '#94a3b8');
            });
            transitionToScene(0);
        }

        function animate() {
            requestAnimationFrame(animate);
            var time = clock.getElapsedTime();
            controls.update();

            // Camera choreography: easing + arc vertikal kecil, tanpa akumulasi posisi.
            if (camAnim) {
                var t = Math.min((time - camAnim.t0) / camAnim.dur, 1);
                var e = easeInOutCubic(t);
                var nextCameraPos = new THREE.Vector3().lerpVectors(camAnim.startPos, camAnim.endPos, e);
                nextCameraPos.y += Math.sin(t * Math.PI) * camAnim.arc;
                camera.position.copy(nextCameraPos);
                var targetE = easeOutQuint(t);
                controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, targetE);
                if (t >= 1) camAnim = null;
            }

            if (smartaDevice) {
                var activeAction = storyScenes[currentScene] && storyScenes[currentScene].act;
                smartaDevice.position.y = smartaBaseY + (prefersReducedMotion ? 0 : Math.sin(time * 0.55) * 0.014);
                var pl = smartaDevice.userData.pirLens;
                var mc = smartaDevice.userData.mic;
                var screen = smartaDevice.userData.screen;
                var leds = smartaDevice.userData.leds || [];
                var sensorPulse = storyRuntime.actionStarted && activeAction === 'pir' ? 0.5 + (Math.sin(time * 3.1) * 0.5 + 0.5) * 0.9 : 0.38;
                var micPulse = storyRuntime.actionStarted && activeAction === 'mic' ? 0.5 + (Math.sin(time * 2.35 + 0.7) * 0.5 + 0.5) * 0.8 : 0.38;
                if (pl) { pl.scale.setScalar(1 + (sensorPulse - 0.38) * 0.08); pl.material.emissiveIntensity = sensorPulse; }
                if (mc) { mc.scale.setScalar(1 + (micPulse - 0.38) * 0.08); mc.material.emissiveIntensity = micPulse; }
                if (screen && activeAction !== 'esp32' && activeAction !== 'cloud' && activeAction !== 'meet') screen.material.emissiveIntensity = 0.42;
                if (leds.length) {
                    var activeLed = activeAction === 'cloud' ? 2 : activeAction === 'esp32' ? 1 : 0;
                    leds.forEach(function(led, i) {
                        var base = i === activeLed ? 0.45 : 0.16;
                        led.material.opacity = base + (i === activeLed ? Math.max(0, Math.sin(time * 1.8 + i)) * 0.35 : 0);
                    });
                }
                if (smartaDevice.userData.beam) {
                    smartaDevice.userData.beam.material.opacity = activeAction === 'pir' ? 0.09 + (Math.sin(time * 1.7) * 0.5 + 0.5) * 0.1 : 0.04;
                }
                if (cloudNode && cloudNode.visible) {
                    cloudNode.rotation.z = Math.sin(time * 0.65) * 0.08;
                    cloudNode.scale.setScalar(0.94 + (Math.sin(time * 1.45) * 0.5 + 0.5) * 0.1);
                }
                var waves = smartaDevice.userData.soundWaves;
                if (waves) waves.forEach(function(w, i) {
                    var phase = (time * 0.42 + i * 0.23) % 1;
                    w.scale.setScalar(0.58 + phase * 1.08);
                    w.material.opacity = activeAction === 'mic' && w.visible ? 0.42 * (1 - phase) : 0;
                });
            }

            if (person && person.userData.torso) {
                // Napas lambat dengan jeda mikro pada kepala dan leher, bukan wobble seragam.
                var breath = prefersReducedMotion ? 0 : Math.sin(time * 0.34) * 0.5 + Math.sin(time * 0.17 + 1.1) * 0.12;
                var br = 1 + breath * 0.035;
                person.userData.torso.scale.set(br, 1, br * 0.985);
                if (person.userData.head) {
                    person.userData.head.position.y = person.userData.headBaseY + breath * 0.009;
                    person.userData.head.rotation.y = breath * 0.018;
                }
                if (person.userData.neck) person.userData.neck.position.y = 1.14 + breath * 0.006;
            }

            particles.forEach(function(p) {
                var ud = p.userData;
                if (!smartaDevice || !person || !person.userData.torso) return;
                ud.progress += ud.speed;
                if (ud.progress >= 1) ud.progress = 0;
                var e = ud.progress;
                var o = new THREE.Vector3();
                var target = new THREE.Vector3();
                if (ud.cloud) {
                    smartaDevice.getWorldPosition(o);
                    if (cloudNode) cloudNode.getWorldPosition(target);
                    else target.set(o.x + ud.lane * 2.5, o.y + 3.1, o.z - 1.7);
                    target.x += ud.lane;
                    p.position.lerpVectors(o, target, e);
                } else {
                    var origin = ud.type === 'PIR' ? person.userData.torso : person.userData.head;
                    var sensor = ud.type === 'PIR' ? smartaDevice.userData.pirLens : smartaDevice.userData.mic;
                    origin.getWorldPosition(o);
                    sensor.getWorldPosition(target);
                    p.position.lerpVectors(o, target, e);
                }
                var sway = Math.sin(e * Math.PI);
                p.position.x += Math.sin(time * 1.8 + ud.wobble) * (ud.cloud ? 0.035 : 0.025) * sway;
                p.position.y += Math.cos(time * 1.5 + ud.wobble) * (ud.cloud ? 0.04 : 0.025) * sway;
                p.material.opacity = (ud.cloud ? 0.72 : 0.82) * sway;
            });

            renderer.render(scene, camera);
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start dengan fallback: kalau CDN gagal, tampilkan pesan
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT') {
                document.getElementById('status').textContent = '⚠️ Gagal memuat 3D library — cek koneksi internet';
                document.getElementById('status').style.color = '#f87171';
            }
        }, true);

        if (typeof THREE === 'undefined') {
            document.getElementById('status').textContent = '⚠️ THREE.js tidak termuat';
            document.getElementById('loading').classList.add('hidden');
        } else {
            init();
        }
    </script>
</body>
</html>
